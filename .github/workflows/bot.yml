name: bot
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
concurrency:
  group: bot-cycle
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Cycle horaire
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEELARK_APP_ID: ${{ secrets.GEELARK_APP_ID }}
          GEELARK_API_KEY: ${{ secrets.GEELARK_API_KEY }}
          IG_SESSION_COOKIE: ${{ secrets.IG_SESSION_COOKIE }}
          ALIAS_COMPTES: ${{ secrets.ALIAS_COMPTES }}
          GEELARK_WATCH: 'jalinewayness'
        run: node index.js
