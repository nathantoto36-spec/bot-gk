name: bot2

# Cycle horaire (classement groupe 2), en BOUCLE CONTINUE.
# GitHub retarde beaucoup les crons frequents : ce job tourne ~5h40 d'affilee
# et relance index.js toutes les ~60 min (le cycle groupe 2 peut durer jusqu'a
# ~35 min via BUDGET_MS). Le cron ne sert qu'a RELANCER la boucle (toutes les
# 3h). Avec cancel-in-progress false, un nouveau job attend la fin du precedent
# -> couverture quasi continue. index.js est sans etat : aucun commit requis.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
concurrency:
  group: bot2-cycle
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Boucle cycle horaire (groupe 2)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEELARK_APP_ID: ${{ secrets.GEELARK_APP_ID }}
          GEELARK_API_KEY: ${{ secrets.GEELARK_API_KEY }}
          # Instagram limite la SESSION liee a ce cookie (429 sur tous les comptes),
          # pas l'IP : en anonyme les appels passent. Pour reactiver la session,
          # decommenter la ligne ci-dessous.
          # IG_SESSION_COOKIE: ${{ secrets.IG_SESSION_COOKIE }}
          ALIAS_COMPTES: ${{ secrets.ALIAS_COMPTES }}
          GEELARK_GROUP: 'tkanuya account 2'
          GEELARK_GROUP_RAW: 'true'
          SALON_REELS: '1539514777758470224'
          SALON_CLASSEMENT: '1539514911728861244'
          SALON_ILLISIBLE: '1540213344894591036'
          SALON_BANS: '1540221364370411600'
          SALON_ZERO: '1540234183451086858'
          SALON_MOYENNE: '1540251225520341133'
          SALON_500: '1540410529775091792'
          SALON_LEGENDE: '1540437709385109545'
          BUDGET_MS: '2100000'
          INSTA_CONCURRENCE: '5'
          MAX_MESSAGES: '150'
        run: |
          fin=$(( $(date +%s) + 20400 ))   # ~5h40 de boucle
          i=0
          while [ "$(date +%s)" -lt "$fin" ]; do
            echo "::group::cycle groupe 2 (i=$i)"
            node index.js || true
            echo "::endgroup::"
            i=$(( i + 1 ))
            sleep 3600
          done
          echo "Boucle terminee apres $i cycle(s)."
